services:
  db:
    image: postgres:16
    container_name: moovie-db
    env_file: .env
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - moovie-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moovie}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    container_name: moovie-backend
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-moovie}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moovie}
    restart: unless-stopped

volumes:
  moovie-pgdata:
